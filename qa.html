<!doctype html><html><head><title>Responsive QA</title><style>body{margin:0;background:#20252b;color:white;font:13px system-ui}header{display:flex;gap:16px;align-items:center;padding:10px;position:sticky;top:0;background:#20252b;z-index:2}select,button{padding:8px}#stage{margin:0 auto;width:max-content;transform-origin:top center}iframe{border:0;display:block;background:#05070a}#report{font-size:11px;white-space:pre-wrap;max-width:600px;max-height:60px;overflow:auto}</style></head><body><header><label>Viewport <select id="width"><option>360</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option><option>1920</option></select></label><button id="inspect">Inspect layout</button><button id="scan">Scan all widths</button><output id="report"></output></header><div id="stage"><iframe title="Responsive site preview" id="site" src="/" width="390" height="844"></iframe></div><script>
const frame=document.getElementById('site'),width=document.getElementById('width'),stage=document.getElementById('stage'),report=document.getElementById('report');
function resize(){frame.width=Number(width.value);frame.height=width.value<540?844:1000;const scale=Math.min(1,(innerWidth-40)/Number(width.value));stage.style.transform=`scale(${scale})`;}
function inspect(){const doc=frame.contentDocument;return {width:Number(frame.width),client:doc.documentElement.clientWidth,scroll:doc.documentElement.scrollWidth,overflow:doc.documentElement.scrollWidth>doc.documentElement.clientWidth,broken:[...doc.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src'))};}
width.onchange=resize;document.getElementById('inspect').onclick=()=>report.textContent=JSON.stringify(inspect());document.getElementById('scan').onclick=async()=>{const rows=[];for(const w of [360,390,430,768,1024,1440,1920]){width.value=w;resize();await new Promise(r=>setTimeout(r,250));rows.push(inspect());}report.textContent=JSON.stringify(rows);width.value='390';resize();};resize();
</script></body></html>
